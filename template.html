<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <!-- Usunięto viewport, aby uniknąć skalowania wymiarów bezwzględnych (mm) -->
    <title>Template A4 - 8 placeholderów 71x71mm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e0e0e0;
        }

        /* Strona A4 dokładnie 210x297mm */
        .page {
            position: relative;
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 0 auto;
            outline: 2px solid red;
            /* czerwona ramka do kalibracji */
        }

        /* Ramka zewnętrzna 71x71mm */
        .frame {
            position: absolute;
            width: 71mm;
            height: 71mm;
            border: 1.5pt solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Wewnętrzny szary kwadrat 52x52mm z ramką */
        .photo-area {
            position: relative;
            width: 52mm;
            height: 52mm;
            background: #b0b0b0;
            border: 1pt solid black;
            overflow: visible;
        }

        /* Przerywane linie przechodzące przez rogi, prostopadłe do przekątnych */
        .dash {
            position: absolute;
            width: 25mm;
            height: 0;
            border-top: 1pt dashed black;
            transform-origin: center center;
        }

        /* Lewy-górny róg */
        .dash-tl {
            top: 0;
            left: 0;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* Prawy-górny róg */
        .dash-tr {
            top: 0;
            right: 0;
            transform: translate(50%, -50%) rotate(45deg);
        }

        /* Lewy-dolny róg */
        .dash-bl {
            bottom: 0;
            left: 0;
            transform: translate(-50%, 50%) rotate(45deg);
        }

        /* Prawy-dolny róg */
        .dash-br {
            bottom: 0;
            right: 0;
            transform: translate(50%, 50%) rotate(-45deg);
        }

        /* Pozycje ramek – margines górny 5mm, odstęp pionowy 1mm */
        .f1 {
            left: 20mm;
            top: 5mm;
        }

        .f2 {
            left: 119mm;
            top: 5mm;
        }

        .f3 {
            left: 20mm;
            top: 77mm;
        }

        .f4 {
            left: 119mm;
            top: 77mm;
        }

        .f5 {
            left: 20mm;
            top: 149mm;
        }

        .f6 {
            left: 119mm;
            top: 149mm;
        }

        .f7 {
            left: 20mm;
            top: 221mm;
        }

        .f8 {
            left: 119mm;
            top: 221mm;
        }

        @page {
            size: 210mm 297mm;
            margin: 0;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
                outline: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <!-- Ramka 1 -->
        <div class="frame f1">
            <div class="photo-area">
                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 2 -->
        <div class="frame f2">
            <div class="photo-area">
                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 3 -->
        <div class="frame f3">
            <div class="photo-area">
                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 4 -->
        <div class="frame f4">
            <div class="photo-area">
                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 5 -->
        <div class="frame f5">
            <div class="photo-area">
                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 6 -->

                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>
        <!-- Ramka 7 (nowy rząd) -->
        <div class="frame f7">

                <div class="dash dash-tl"></div>
                <div class="dash dash-tr"></div>
                <div class="dash dash-bl"></div>
                <div class="dash dash-br"></div>
            </div>
        </div>

</body>

</html>
