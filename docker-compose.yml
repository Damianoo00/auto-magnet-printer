services:
  auto-print:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-print
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${PWD}/incoming
        target: /app/incoming
      - type: bind
        source: ${PWD}/pending
        target: /app/pending
      - type: bind
        source: ${PWD}/archive
        target: /app/archive
      - type: bind
        source: ${PWD}/rejected
        target: /app/rejected
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT}
      - WEDDING_TEXT=${WEDDING_TEXT}
      - WEDDING_FONT_SIZE=${WEDDING_FONT_SIZE}
      - DATE_TEXT=${DATE_TEXT}
      - DATE_FONT_SIZE=${DATE_FONT_SIZE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/state')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
